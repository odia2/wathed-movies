<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movies</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 20px;
        }

        .logo { font-size: 24px; font-weight: bold; color: var(--accent); }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .search-result-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid #334155;
        }

        .search-result-item:hover {
            background: #334155;
        }

        .search-result-item img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 15px 40px;
            background: #1e293b;
            margin: 20px 40px;
            border-radius: 12px;
        }

        .stat-item { font-size: 14px; color: #94a3b8; }
        .stat-value { font-size: 18px; font-weight: bold; color: var(--text-main); }

        .libraries {
            display: flex;
            gap: 10px;
            padding: 0 40px;
            margin-bottom: 20px;
        }

        .lib-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lib-btn.active, .lib-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
            position: relative;
            cursor: pointer;
        }

        .movie-card:hover { transform: translateY(-5px); }

        .poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #0f172a;
        }

        .card-info { padding: 15px; }
        .title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .year { font-size: 12px; color: #94a3b8; }
        .rating { color: #fbbf24; margin-top: 5px; }

        .comment-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
        }

        .comment-box {
            display: none;
            background: #0f172a;
            padding: 10px;
            font-size: 12px;
            color: #cbd5e1;
            border-top: 1px solid #334155;
        }

        .comment-box.show { display: block; }

        .delete-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(220, 38, 38, 0.9);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            display: none;
        }

        .movie-card.admin .delete-btn { display: block; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 900px;
            margin: 40px auto;
            border-radius: 16px;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            gap: 30px;
            padding: 30px;
        }

        .modal-poster {
            width: 300px;
            border-radius: 12px;
        }

        .modal-info { flex: 1; }
        .modal-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .modal-meta { color: #94a3b8; margin-bottom: 20px; }
        .modal-overview { line-height: 1.6; margin-bottom: 20px; }
        .modal-rating { font-size: 20px; color: #fbbf24; }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .user-comment-section {
            padding: 20px 30px;
            border-top: 1px solid #334155;
        }

        .user-comment-section h3 { margin-bottom: 10px; color: var(--accent); }
        .user-comment-text { color: #cbd5e1; line-height: 1.5; }

        #login-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
        }

        button.primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .add-modal-content {
            background: var(--card-bg);
            max-width: 500px;
            margin: 100px auto;
            border-radius: 16px;
            padding: 30px;
        }

        .add-modal-content h2 { margin-bottom: 20px; }
        .add-modal-content label { display: block; margin-bottom: 5px; color: #94a3b8; }
        .add-modal-content textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            resize: vertical;
            min-height: 100px;
        }
        .rating-select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-group button { flex: 1; }
        .btn-cancel {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="login-modal">
        <div class="login-box">
            <h2>Вхід</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button class="primary" onclick="login()">Увійти</button>
            <p style="font-size:12px; color:#94a3b8; margin-top:10px;">Тільки для своїх</p>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">MY MOVIES</div>
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="Пошук фільмів (TMDB)...">
            <div class="search-results" id="search-results"></div>
        </div>
        <div class="user-profile" onclick="logout()">
            <span id="user-email">Гість</span>
            <div class="avatar" id="user-avatar">U</div>
        </div>
    </header>

    <!-- Stats -->
    <div class="stats-bar">
        <div class="stat-item">Всього: <span class="stat-value" id="stat-total">0</span></div>
        <div class="stat-item">Середня оцінка: <span class="stat-value" id="stat-avg">0</span></div>
        <div class="stat-item">Улюблений жанр: <span class="stat-value" id="stat-genre">-</span></div>
    </div>

    <!-- Libraries -->
    <div class="libraries">
        <button class="lib-btn active" onclick="filterMovies('all')">Всі фільми</button>
        <button class="lib-btn" onclick="filterMovies('watchlist')">Хочу подивитись</button>
        <button class="lib-btn" onclick="filterMovies('favorites')">Улюблені</button>
    </div>

    <!-- Movie Grid -->
    <div class="movie-grid" id="movie-grid"></div>

    <!-- Movie Detail Modal -->
    <div class="modal-overlay" id="movie-modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-content">
            <div class="modal-header">
                <img class="modal-poster" id="modal-poster" src="" alt="">
                <div class="modal-info">
                    <h1 class="modal-title" id="modal-title"></h1>
                    <p class="modal-meta" id="modal-meta"></p>
                    <p class="modal-overview" id="modal-overview"></p>
                    <p class="modal-rating" id="modal-rating"></p>
                </div>
            </div>
            <div class="user-comment-section">
                <h3>Мій коментар</h3>
                <p class="user-comment-text" id="modal-comment"></p>
            </div>
        </div>
    </div>

    <!-- Add Movie Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="add-modal-content">
            <h2>Додати фільм</h2>
            <input type="hidden" id="add-tmdb-id">
            <input type="hidden" id="add-poster">
            <input type="hidden" id="add-year">
            <input type="hidden" id="add-genre">
            
            <label>Назва:</label>
            <input type="text" id="add-title" readonly>
            
            <label>Твоя оцінка:</label>
            <select class="rating-select" id="add-rating">
                <option value="10/10">10/10</option>
                <option value="9/10">9/10</option>
                <option value="8/10">8/10</option>
                <option value="7/10">7/10</option>
                <option value="6/10">6/10</option>
                <option value="5/10">5/10</option>
                <option value="4/10">4/10</option>
                <option value="3/10">3/10</option>
                <option value="2/10">2/10</option>
                <option value="1/10">1/10</option>
                <option value="11/10">11/10 🔥</option>
                <option value="12/10">12/10 🔥🔥</option>
                <option value="13/10">13/10 🔥🔥🔥</option>
            </select>
            
            <label>Коментар:</label>
            <textarea id="add-comment" placeholder="Твій коментар (необов'язково)"></textarea>
            
            <div class="btn-group">
                <button class="btn-cancel" onclick="closeAddModal()">Скасувати</button>
                <button class="primary" onclick="saveMovie()">Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Firebase + App -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgkpCnK2QjMCE6HLwPBzJrnsaYRDr3YBc",
            authDomain: "wathed-movies.firebaseapp.com",
            projectId: "wathed-movies",
            storageBucket: "wathed-movies.firebasestorage.app",
            messagingSenderId: "54824906865",
            appId: "1:54824906865:web:58f419a6824aae41f6abd0",
            measurementId: "G-K153BLFVSW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TMDB_KEY = "e58d0bd8f6cdc8a3a80354d83e044fe4";
        const ADMIN_EMAIL = "bogdan17261726@gmail.com";

        let allMovies = [];
        let isAdmin = false;
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                isAdmin = user.email === ADMIN_EMAIL;
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').innerText = user.email[0].toUpperCase();
                loadMovies();
            } else {
                currentUser = null;
                isAdmin = false;
                document.getElementById('login-modal').style.display = 'flex';
                document.getElementById('movie-grid').innerHTML = '';
            }
        });

        window.login = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                alert("Помилка: " + e.message);
            }
        };

        window.logout = () => signOut(auth);

        async function loadMovies() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '<div style="color:#94a3b8">Завантаження...</div>';

            allMovies = [];
            const querySnapshot = await getDocs(collection(db, "movies"));
            querySnapshot.forEach((doc) => {
                allMovies.push({ id: doc.id, ...doc.data() });
            });

            renderMovies(allMovies);
            updateStats();
        }

        function renderMovies(movies) {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card' + (isAdmin ? ' admin' : '');
                card.onclick = () => openModal(movie);

                card.innerHTML = `
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteMovie('${movie.id}')">🗑 Видалити</button>
                    <button class="comment-toggle" onclick="event.stopPropagation(); this.nextElementSibling.nextElementSibling.classList.toggle('show')">‹</button>
                    <img src="${movie.poster}" class="poster" alt="${movie.title}">
                    <div class="card-info">
                        <div class="title">${movie.title}</div>
                        <div class="year">${movie.year}</div>
                        <div class="rating">⭐ ${movie.rating}</div>
                    </div>
                    <div class="comment-box">${movie.comment || ''}</div>
                `;

                grid.appendChild(card);
            });
        }

        // Фільтрація бібліотек
        window.filterMovies = (filter) => {
            const buttons = document.querySelectorAll('.lib-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let filtered = allMovies;

            if (filter === 'favorites') {
                filtered = allMovies.filter(m => {
                    const num = parseFloat(m.rating);
                    return num >= 10;
                });
            } else if (filter === 'watchlist') {
                filtered = allMovies.filter(m => m.comment && m.comment.length > 0);
            }

            renderMovies(filtered);
        };

        // Search
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let searchTimeout = null;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                searchResults.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(async () => {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=ru-RU`);
                const data = await res.json();
                
                if (data.results.length > 0) {
                    searchResults.innerHTML = '';
                    data.results.slice(0, 5).forEach(movie => {
                        const item = document.createElement('div');
                        item.className = 'search-result-item';
                        item.innerHTML = `
                            <img src="${movie.poster_path ? 'https://image.tmdb.org/t/p/w92' + movie.poster_path : 'https://via.placeholder.com/40x60'}" alt="">
                            <div>
                                <div style="font-weight:bold">${movie.title}</div>
                                <div style="font-size:12px;color:#94a3b8">${movie.release_date?.substring(0,4) || 'N/A'}</div>
                            </div>
                        `;
                        item.onclick = () => openAddModal(movie);
                        searchResults.appendChild(item);
                    });
                    searchResults.style.display = 'block';
                } else {
                    searchResults.style.display = 'none';
                }
            }, 300);
        });

        window.openAddModal = (movie) => {
            document.getElementById('add-tmdb-id').value = movie.id;
            document.getElementById('add-title').value = movie.title;
            document.getElementById('add-poster').value = movie.poster_path ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path : '';
            document.getElementById('add-year').value = movie.release_date?.substring(0,4) || 'N/A';
            document.getElementById('add-genre').value = '';
            document.getElementById('add-comment').value = '';
            document.getElementById('add-modal').style.display = 'block';
            searchResults.style.display = 'none';
            searchInput.value = '';
        };

        window.closeAddModal = () => {
            document.getElementById('add-modal').style.display = 'none';
        };

        window.saveMovie = async () => {
            console.log("Збереження почалося...");
            
            try {
                const tmdb_id = document.getElementById('add-tmdb-id').value;
                const title = document.getElementById('add-title').value;
                const poster = document.getElementById('add-poster').value;
                const year = document.getElementById('add-year').value;
                const rating = document.getElementById('add-rating').value;
                const comment = document.getElementById('add-comment').value;

                const docRef = await addDoc(collection(db, "movies"), {
                    tmdb_id,
                    title,
                    poster,
                    year,
                    rating,
                    comment,
                    genre: 'Не вказано',
                    addedBy: currentUser.email,
                    createdAt: new Date().toISOString()
                });

                console.log("Фільм додано з ID:", docRef.id);

                closeAddModal();
                loadMovies();
                alert('Фільм додано!');
            } catch (e) {
                console.error("Помилка збереження:", e);
                alert("Помилка: " + e.message);
            }
        };

        window.deleteMovie = async (id) => {
            if (!confirm('Видалити цей фільм?')) return;
            await deleteDoc(doc(db, "movies", id));
            loadMovies();
        };

        async function openModal(movie) {
            const modal = document.getElementById('movie-modal');
            
            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-poster').src = movie.poster;
            document.getElementById('modal-meta').innerText = `${movie.year} • ${movie.genre || 'Не вказано'}`;
            document.getElementById('modal-rating').innerText = `Твоя оцінка: ${movie.rating}`;
            document.getElementById('modal-comment').innerText = movie.comment || "Немає коментаря";

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.tmdb_id}?api_key=${TMDB_KEY}&language=ru-RU`);
                const data = await res.json();
                document.getElementById('modal-overview').innerText = data.overview || "Опис відсутній";
            } catch (e) {
                document.getElementById('modal-overview').innerText = "Не вдалося завантажити опис";
            }

            modal.style.display = 'block';
        }

        window.closeModal = () => {
            document.getElementById('movie-modal').style.display = 'none';
        };

        function updateStats() {
            document.getElementById('stat-total').innerText = allMovies.length;
            
            const avg = allMovies.reduce((sum, m) => {
                const num = parseFloat(m.rating);
                return sum + (isNaN(num) ? 0 : num);
            }, 0) / allMovies.length;
            document.getElementById('stat-avg').innerText = avg.toFixed(1);

            document.getElementById('stat-genre').innerText = "Бойовик";
        }

        document.getElementById('movie-modal').addEventListener('click', (e) => {
            if (e.target.id === 'movie-modal') closeModal();
        });

        document.getElementById('add-modal').addEventListener('click', (e) => {
            if (e.target.id === 'add-modal') closeAddModal();
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                searchResults.style.display = 'none';
            }
        });
    </script>
</body>
</html>
